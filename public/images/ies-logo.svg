<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Gear/cog outer ring -->
  <g transform="translate(100,100)">
    <!-- Gear teeth -->
    <g fill="#1565C0">
      <path d="M0,-95 L12,-95 L15,-80 L-15,-80 L-12,-95 Z" transform="rotate(0)"/>
      <path d="M0,-95 L12,-95 L15,-80 L-15,-80 L-12,-95 Z" transform="rotate(30)"/>
      <path d="M0,-95 L12,-95 L15,-80 L-15,-80 L-12,-95 Z" transform="rotate(60)"/>
      <path d="M0,-95 L12,-95 L15,-80 L-15,-80 L-12,-95 Z" transform="rotate(90)"/>
      <path d="M0,-95 L12,-95 L15,-80 L-15,-80 L-12,-95 Z" transform="rotate(120)"/>
      <path d="M0,-95 L12,-95 L15,-80 L-15,-80 L-12,-95 Z" transform="rotate(150)"/>
      <path d="M0,-95 L12,-95 L15,-80 L-15,-80 L-12,-95 Z" transform="rotate(180)"/>
      <path d="M0,-95 L12,-95 L15,-80 L-15,-80 L-12,-95 Z" transform="rotate(210)"/>
      <path d="M0,-95 L12,-95 L15,-80 L-15,-80 L-12,-95 Z" transform="rotate(240)"/>
      <path d="M0,-95 L12,-95 L15,-80 L-15,-80 L-12,-95 Z" transform="rotate(270)"/>
      <path d="M0,-95 L12,-95 L15,-80 L-15,-80 L-12,-95 Z" transform="rotate(300)"/>
      <path d="M0,-95 L12,-95 L15,-80 L-15,-80 L-12,-95 Z" transform="rotate(330)"/>
    </g>
    <!-- Gear body ring -->
    <circle cx="0" cy="0" r="82" fill="#1565C0"/>
    <circle cx="0" cy="0" r="68" fill="#FFD600"/>

    <!-- Atom orbits -->
    <ellipse cx="0" cy="0" rx="50" ry="18" fill="none" stroke="#1A237E" stroke-width="3" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="50" ry="18" fill="none" stroke="#1A237E" stroke-width="3" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="50" ry="18" fill="none" stroke="#1A237E" stroke-width="3" transform="rotate(90)"/>

    <!-- Red cross/bar -->
    <rect x="-55" y="-10" width="110" height="20" rx="2" fill="#D32F2F"/>

    <!-- Atom electrons -->
    <circle cx="0" cy="0" r="6" fill="#1A237E"/>
    <circle cx="40" cy="-23" r="4" fill="#1A237E"/>
    <circle cx="-40" cy="-23" r="4" fill="#1A237E"/>
    <circle cx="0" cy="46" r="4" fill="#1A237E"/>

    <!-- Text: THE INSTITUTION OF ENGINEERS -->
    <path id="topArc" d="M0,-76 a76,76 0 0,1 0,152" fill="none"/>
    <path id="bottomArc" d="M-60,60 a76,76 0 0,0 120,0" fill="none"/>
  </g>

  <!-- Circular text -->
  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="11" fill="white" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">THE INSTITUTION OF ENGINEERS</textPath>
  </text>
  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="13" fill="white" letter-spacing="4">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">SINGAPORE</textPath>
  </text>
</svg>
