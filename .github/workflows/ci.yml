name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: lint-typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (same Dockerfile Coolify uses)
        run: docker build --build-arg NEXT_PUBLIC_APP_URL=https://learnify.tertiaryinfotech.com -t ai-learnify:ci .

  # Deployment is handled by Coolify: a GitHub webhook on this repository
  # (push to main) triggers a rebuild of the same Dockerfile on the
  # Hostinger VPS, which runs `prisma migrate deploy` on boot.
  # See docs/deployment/coolify.md.
